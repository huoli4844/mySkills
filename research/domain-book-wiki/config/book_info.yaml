# book_info.yaml — 书籍配置信息
# index_assembler.py 从此文件读取总揽描述，不再硬编码
# 每本书在 .dag/book_info.yaml 中覆盖此文件配置

version: "1.0"
domain: "电磁兼容"

# 书籍通用描述模板（{book_name} 会自动替换）
book_template: |
  《{book_name}》是一本系统全面的{domain}领域专业教材，全书共 {chapter_count} 章，构建了从基础理论到工程实践的完整知识体系。

  教材以电磁兼容三要素（干扰源、耦合途径、敏感设备）为主线，内容涵盖{ch_desc}。各章主要内容如下：

  {chapter_descriptions}

  本知识库基于教材原文，通过结构化知识加工构建了 {total} 个知识节点，其中核心概念 {c_count} 个、知识要素/实体 {e_count} 个、知识点 {k_count} 个、技能点 {s_count} 个、应用场景 {sc_count} 个。

  知识库以 Bloom 认知层级理论为指导，通过「概念→知识要素→知识点→技能点→应用场景」的五级学习链路组织知识，实现从知识记忆、理解、应用到分析、评价、创造的完整认知跃迁。所有节点均通过双向 wikilink 建立关联网络，图谱质量检查机制确保知识链完整性与内容深度。

  适合{domain}领域的在校本科生和研究生、工程技术人员及相关领域的科研工作者进行系统化学习、教学参考和工程实践指导。

  知识库提供知识图谱全景视图、动态学习路径推荐、Bloom 认知层级思维导图，以及按概念/知识点/技能点/应用场景的索引导航，支持按章节顺序学习或按知识关联网络自由探索两种学习模式。

# 各章描述（按章节号索引）
# 其他书只需修改此映射即可
chapter_descriptions:
  1: "介绍{domain}的基本概念、发展历史、标准化体系与认证制度，阐述电磁干扰三要素分析框架，为全书奠定理论基础。"
  2: "讲解传导耦合与辐射耦合的电磁理论基础，包括传输线理论、天线模型、近场与远场特性，以及瞬态干扰的产生机理。"
  3: "介绍{domain}预测的基本原理与方法论，涵盖系统级与设备级预测模型、数值计算方法，以及预测软件工具的应用。"
  4: "深入讲解三大核心抑制技术——屏蔽、滤波、接地，包括屏蔽效能分析、滤波器设计与选型、接地系统设计，以及搭接、隔离等辅助方法。"
  5: "聚焦 PCB 级{domain}设计实践，涵盖元器件高频特性与选型、PCB 层叠与布局布线规则、电源完整性设计等工程要点。"
  6: "系统阐述测量原理、标准体系、测量设备与方法，以及测量结果评估与不确定度分析。"
  7: "聚焦无线电频谱资源管理的基本任务与流程，包括频率划分、规划、分配、指配的四步流程，频谱监测技术，以及联合作战电磁频谱管理。"
  8: "拓展至雷电防护、强电磁脉冲防护、电磁信息泄漏防护、生物电磁效应与辐射安全等特殊应用领域。"
