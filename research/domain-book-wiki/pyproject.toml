[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "domain-book-wiki"
version = "45.0"
description = "Python骨架DAG + Agent LLM：从教材构建四级知识体系"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B905", "SIM105", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: 耗时超过 2 秒的测试",
    "integration: 需要真实文件系统的集成测试",
    "unit: 纯逻辑单元测试",
    "smoke: 冒烟测试（核心模块导入和基本功能）",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = false
ignore_missing_imports = true
exclude = ["scripts/tests/", "scripts/_convert_print_to_log.py", "scripts/_split_dag_pipeline.py"]

# v45.1: mypy 渐进严格化——全局 disallow_untyped_defs=true。
# 当前各模块仍豁免 disallow_untyped_defs（待逐模块添加类型标注），
# 但已移除 disable_error_code 全量豁免，基础类型错误（如参数数量、属性访问）仍会报告。
# 迁移路线：逐模块从 override 列表移除 → 添加类型标注 → mypy 零错误。
[[tool.mypy.overrides]]
module = [
    "config",
    "content_check_rules",
    "dag_controller",
    "dag_index",
    "dag_pipeline_done",
    "dag_pipeline_ops",
    "dag_pipeline_run",
    "dag_quality",
    "dag_state",
    "formula_utils",
    "generate_index_data",
    "graph_analytics",
    "graph_quality",
    "index_assembler",
    "kb_graph",
    "kb_graph_builder",
    "log_utils",
    "parse_utils",
    "phase_validator",
    "pipeline_auto",
    "pipeline_extras",
    "post_build_fix",
    "preflight",
    "preprocess_toc",
    "quality_graph_checks",
    "schema",
    "script_runner",
    "tac_constants",
    "tac_quality",
    "template_assembler",
    "validate_mermaid_syntax",
    "verify_concepts_from_source",
    "yaml_gen",
    "yaml_auto_fill",
    "yaml_pre_validate",
]
disallow_untyped_defs = false
check_untyped_defs = false
