# knowledge_keywords.yaml — 领域知识关键词映射
# 用于解答内容增强功能：将题目关键词映射到源文搜索词
# 每个领域一本，存于技能 config/ 目录
# 技能自动按领域名匹配加载，匹配不到时用默认空映射

domain: "电磁兼容"
version: "1.0"

# 题目关键词 → 源文搜索关键词映射
# key: 题目中出现的关键词片段
# value: 在源文中搜索的相关词列表
keyword_maps:
  # ── 电磁兼容领域 ──
  防雷电: ["雷击浪涌", "防雷", "SPD", "浪涌保护", "避雷", "接地"]
  静电: ["静电放电", "ESD"]
  屏蔽: ["屏蔽", "屏蔽效能", "SE"]
  滤波: ["滤波", "滤波器", "EMI滤波", "插入损耗"]
  接地: ["接地", "地线", "公共阻抗", "地环路"]
  瞬态: ["瞬态", "EFT", "浪涌", "脉冲群"]
  感性耦合: ["互感", "磁耦合", "电感性耦合"]
  容性耦合: ["电容性耦合"]
  传导耦合: ["传导耦合", "共阻抗", "地环路"]
  辐射: ["辐射", "天线", "电磁波"]
  电磁兼容: ["电磁兼容", "EMC"]
  麦克斯韦: ["麦克斯韦", "Maxwell"]
  绝缘: ["绝缘", "耐压", "爬电距离"]
  浪涌: ["浪涌", "Surge", "雷击"]
  EFT: ["EFT", "脉冲群", "电快速瞬变"]
  ESD: ["ESD", "静电放电"]
  电源线滤波: ["电源线滤波器", "EMI滤波", "插入损耗"]
