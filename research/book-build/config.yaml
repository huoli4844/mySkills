# --- 知识库路径 ---
knowledge_base:
  processed_dir: "/Users/huoli4844/Desktop/电磁兼容/处理后/"
  raw_dir: "/Users/huoli4844/Desktop/电磁兼容知识库/"
  domain_dir: "/Users/huoli4844/Desktop/电磁兼容知识库/电磁兼容领域/"

# --- 工作流模式 ---
workflow:
  default_mode: "fast"               # "fast" 或 "full"
  phase_0_5_auto: true               # true = 跳过用户确认直接动笔
  quality_auto_fix: true             # true = 质量检查自动修复

# --- 体量基准 ---
volume:
  benchmark_chapter: 1               # 基准章号
  benchmark_bytes: 83000             # 第1章字节数
  benchmark_lines: 1800              # 第4章（标杆）行数
  benchmark_formulas: 97             # 第4章（标杆）公式数
  thin_threshold_lines: 700          # 偏薄判定：行数
  thin_threshold_kb: 35              # 偏薄判定：KB
  target_multiplier_min: 1.2         # 最小目标倍数（相对第1章）
  target_bytes_per_chapter: 80000    # 每章目标字节数
  target_mermaid_min: 6              # 每章最少Mermaid图数

# --- 输出格式 ---
output:
  format: "md"                       # "md"(Obsidian) 或 "docx"
  md_ext: ".md"
  docx_ext: ".docx"
  forbid_wikilink: true              # 教材禁止 [[wikilink]]
